<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">五模型成绩、文件体积和输出 Token</title><desc id="desc">Swift 总分接近 GSQ，但输出 Token 约为后者的 46%</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style><rect width="1100" height="550" rx="18" fill="#f7f9fc"/><text x="32" y="48" fill="#17263d" font-size="27" font-weight="700" text-anchor="start">五模型成绩与资源画像</text><text x="32" y="78" fill="#627287" font-size="14" font-weight="400" text-anchor="start">共同 801 题；主模型文件为十进制 GB；输出 Token 为当前保存的逐题结果</text><text x="32" y="123" fill="#52647a" font-size="15" font-weight="700" text-anchor="start">模型 / 量化</text><text x="300" y="123" fill="#52647a" font-size="15" font-weight="700" text-anchor="start">综合分</text><text x="665" y="123" fill="#52647a" font-size="15" font-weight="700" text-anchor="start">主文件</text><text x="865" y="123" fill="#52647a" font-size="15" font-weight="700" text-anchor="start">输出 Token</text><rect x="20" y="143" width="1060" height="52" rx="9" fill="#fff"/><text x="32" y="176" fill="#173047" font-size="18" font-weight="700" text-anchor="start">GSQ</text><text x="172" y="176" fill="#5e7185" font-size="14" font-weight="600" text-anchor="start">IQ3_S</text><rect x="300" y="162" width="260.7" height="16" rx="8" fill="#477aa3"/><text x="594" y="176" fill="#477aa3" font-size="18" font-weight="700" text-anchor="end">83.72</text><rect x="665" y="162" width="66.7" height="16" rx="8" fill="#dd955d"/><text x="812" y="176" fill="#825329" font-size="15" font-weight="700" text-anchor="end">12.12 GB</text><rect x="865" y="162" width="117.1" height="16" rx="8" fill="#9271b4"/><text x="1067" y="176" fill="#61437c" font-size="15" font-weight="700" text-anchor="end">5.32M</text><rect x="20" y="209" width="1060" height="52" rx="9" fill="#e0f2ef"/><text x="32" y="242" fill="#173047" font-size="18" font-weight="700" text-anchor="start">Swift</text><text x="172" y="242" fil